name: Mtrans Sync

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: '源镜像'
        required: true
        type: string
      target_image:
        description: '目标镜像（必须包含注册表域名，例如 ghcr.io/user/repo:tag）'
        required: true
        type: string
      target_auth:
        description: '目标注册表登录凭据（~/.docker/config.json 中 auths 的 auth 值，base64 编码的 用户名:密码）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  copy-image:
    runs-on: ubuntu-24.04
    env:
      SOURCE_IMAGE: ${{ inputs.source_image }}
      TARGET_IMAGE: ${{ inputs.target_image }}
    steps:
      - name: 登录目标注册表
        run: |
          set -euo pipefail

          # 1. 内联读取凭据并立即打掩码：不经 job/step 级 env 声明（env 注入先于掩码，
          #    存在日志回显窗口）；run 脚本内首行 add-mask 后任何回显均显示为 ***
          #    （auth 为 base64，需对 base64 与其解码后的 用户名:密码 两段都打掩码）
          AUTH="${{ inputs.target_auth }}"
          echo "::add-mask::${AUTH}"
          CRED="$(printf '%s' "$AUTH" | base64 -d)"
          USERNAME="${CRED%%:*}"
          PASSWORD="${CRED#*:}"
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::凭据解析失败，请确认 target_auth 为 base64 编码的 用户名:密码" >&2
            exit 1
          fi
          echo "::add-mask::${USERNAME}"
          echo "::add-mask::${PASSWORD}"

          # 2. 从目标镜像提取注册表地址（第一个斜杠前的部分，如 ghcr.io/user/repo:tag -> ghcr.io）
          if [[ "$TARGET_IMAGE" != */* ]]; then
            echo "::error::target_image 必须包含注册表地址，例如 ghcr.io/user/repo:tag" >&2
            exit 1
          fi
          REGISTRY="${TARGET_IMAGE%%/*}"

          # 3. 登录目标注册表（密码通过 stdin 传入，不进入命令行参数与日志）
          printf '%s' "$PASSWORD" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: 复制镜像
        run: |
          set -euo pipefail
          echo "source-image: $SOURCE_IMAGE"
          echo "target-image: $TARGET_IMAGE"
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
